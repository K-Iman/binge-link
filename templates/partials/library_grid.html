<div id="library-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-5 transition-opacity duration-300">
  {% for item in items %}
    {% with media_type=item.media_type|default:type %}
      {% include "partials/media_card.html" %}
    {% endwith %}
  {% empty %}
    <div class="col-span-full flex flex-col items-center justify-center p-12 text-center bg-card border border-border rounded-2xl">
      <svg class="w-12 h-12 text-text-muted mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 0 1 5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
      </svg>
      <h3 class="text-lg font-bold text-text-primary mb-1">No matches found</h3>
      <p class="text-sm text-text-muted">Try adjusting your filters or selecting a different category.</p>
    </div>
  {% endfor %}
</div>
